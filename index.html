<!doctype html>
<html lang="en">

  <meta property="og:title" content="CineBOTrends - Real-Time Box Office Intelligence">

  <meta property="og:url" content="https://cinebotrends.com/">

  <meta name="twitter:site" content="@cinebotrends">
  <meta name="twitter:creator" content="@cinebotrends">
  <meta name="twitter:title" content="CineBOTrends - Real-Time Box Office Intelligence">
  <meta name="twitter:description" content="Track real-time Indian box office collections, advance bookings, occupancy, live ticket sales, movie news and analytics.">
  <meta name="twitter:image" content="https://cinebotrends.com/assets/cbot_card.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <div id="app"></div>

      <div class="splash-logo"><span class="cine">Cine</span> Box Office Trends</div>
      <div class="splash-sub">Real-Time Box Office Intelligence</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
